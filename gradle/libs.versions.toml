[versions]
# Build & Plugins
agp = "8.4.0"
kotlin = "1.9.24"
licenses-plugin = "4.7.0"

# AndroidX
annotation = "1.8.0"
appcompat = "1.6.1"
constraintlayout = "2.1.4"
core-ktx = "1.13.1"
fragment-ktx = "1.7.1"
gridlayout = "1.0.0"
media = "1.7.0"
multidex = "2.0.1"
palette-ktx = "1.0.0"
percentlayout = "1.0.0"
preference-ktx = "1.2.1"
recyclerview = "1.3.2"

# UI & Support Libraries (Material 2)
material = "1.12.0"
material-dialogs = "0.9.6.0"
material-intro = "2.0.0"
materialprogressbar = "1.6.1"
app-theme-helper = "1.3.10"
recyclerview-fastscroll = "1.0.16-kmod"
seekarc = "1.2-kmod"
slidinguppanel = "6"
observablescrollview = "1.6.0"
advrecyclerview = "0.11.0"

# Media & Utils
glide = "4.16.0"
gson = "2.10.1"
jaudiotagger = "v3.0.1o"
markwon = "4.6.2"
retrofit = "2.11.0"
desugar-jdk-libs = "2.0.4"

# Test
junit = "4.13.2"
truth = "1.4.2"
dependency-updates = "0.51.0"

[libraries]
# Gradle Plugins (classpath dependencies)
gradle-android = { module = "com.android.tools.build:gradle", version.ref = "agp" }
gradle-kotlin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
gradle-licenses = { module = "com.cmgapps:gradle-licenses-plugin", version.ref = "licenses-plugin" }

# Kotlin
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }

# AndroidX
androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "annotation" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "fragment-ktx" }
androidx-gridlayout = { module = "androidx.gridlayout:gridlayout", version.ref = "gridlayout" }
androidx-media = { module = "androidx.media:media", version.ref = "media" }
androidx-multidex = { module = "androidx.multidex:multidex", version.ref = "multidex" }
androidx-palette-ktx = { module = "androidx.palette:palette-ktx", version.ref = "palette-ktx" }
androidx-percentlayout = { module = "androidx.percentlayout:percentlayout", version.ref = "percentlayout" }
androidx-preference-ktx = { module = "androidx.preference:preference-ktx", version.ref = "preference-ktx" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }

# UI & Material (Material 2)
material = { module = "com.google.android.material:material", version.ref = "material" }
material-intro = { module = "com.heinrichreimersoftware:material-intro", version.ref = "material-intro" }
materialprogressbar = { module = "me.zhanghai.android.materialprogressbar:library", version.ref = "materialprogressbar" }
app-theme-helper = { module = "com.github.kabouzeid:app-theme-helper", version.ref = "app-theme-helper" }
recyclerview-fastscroll = { module = "com.github.kabouzeid:RecyclerView-FastScroll", version.ref = "recyclerview-fastscroll" }
seekarc = { module = "com.github.kabouzeid:SeekArc", version.ref = "seekarc" }
slidinguppanel = { module = "com.github.kabouzeid:AndroidSlidingUpPanel", version.ref = "slidinguppanel" }
observablescrollview = { module = "com.github.ksoichiro:android-observablescrollview", version.ref = "observablescrollview" }
advrecyclerview = { module = "com.h6ah4i.android.widget.advrecyclerview:advrecyclerview", version.ref = "advrecyclerview" }

# Material Dialogs
material-dialogs-core = { module = "com.afollestad.material-dialogs:core", version.ref = "material-dialogs" }
material-dialogs-commons = { module = "com.afollestad.material-dialogs:commons", version.ref = "material-dialogs" }

# Glide
glide-core = { module = "com.github.bumptech.glide:glide", version.ref = "glide" }
glide-okhttp3 = { module = "com.github.bumptech.glide:okhttp3-integration", version.ref = "glide" }
glide-compiler = { module = "com.github.bumptech.glide:compiler", version.ref = "glide" }

# Networking & JSON
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
retrofit-core = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-converter-gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "retrofit" }

# Markdown (Markwon)
markwon-core = { module = "io.noties.markwon:core", version.ref = "markwon" }
markwon-html = { module = "io.noties.markwon:html", version.ref = "markwon" }
markwon-image-glide = { module = "io.noties.markwon:image-glide", version.ref = "markwon" }
markwon-linkify = { module = "io.noties.markwon:linkify", version.ref = "markwon" }

# Audio & Desugaring
jaudiotagger = { module = "com.github.VinylMusicPlayer:jaudiotagger", version.ref = "jaudiotagger" }
desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugar-jdk-libs" }

# Test
junit = { module = "junit:junit", version.ref = "junit" }
truth = { group = "com.google.truth", name = "truth", version.ref = "truth" }

[bundles]
material-dialogs = ["material-dialogs-core", "material-dialogs-commons"]
glide = ["glide-core", "glide-okhttp3"]
markwon = ["markwon-core", "markwon-html", "markwon-image-glide", "markwon-linkify"]
retrofit = ["retrofit-core", "retrofit-converter-gson"]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
licenses = { id = "com.cmgapps.licenses", version.ref = "licenses-plugin" }
dependency-updates = { id = "com.github.ben-manes.versions", version.ref = "dependency-updates" }
