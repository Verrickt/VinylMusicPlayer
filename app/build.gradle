apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'

// For dependencies license report
// To use: ./gradlew license<BuildVariant>Report
apply plugin: 'com.cmgapps.licenses'
licenses {
    reports {
        // Enable this JSON generation to get the full data structure
        // json {
        //    enabled = true
        //    destination = layout.buildDirectory.file("reports/licenses/dependencies-licenses.json").get().asFile
        //}

        html.enabled = false // html is enabled by default

        // Generate CSV format
        custom {
            enabled = true
            destination = layout.buildDirectory.file("reports/licenses/dependencies-licenses.csv").get().asFile
            generate {
                final Collection list -> list.collect{
                    [
                        (it.mavenCoordinates.groupId + '.' + it.mavenCoordinates.artifactId) + (it.name != null ? ' - ' + it.name : ''),
                        it.description != null ? it.description.replaceAll('[;\\n\\r]+', ' ') : '',
                        it.licenses[0] != null ? it.licenses[0].name : '',
                        it.licenses[0] != null ? it.licenses[0].url : '',
                    ].join(';')
                }.join('\n') }
        }
    }
}

tasks.withType(com.cmgapps.license.AndroidLicensesTask).configureEach {
    notCompatibleWithConfigurationCache("AndroidLicensesTask does not support configuration cache")
}

android {
    compileSdk 34
    namespace 'com.poupa.vinylmusicplayer'
    defaultConfig {
        minSdk = 19
        targetSdk = 33

        vectorDrawables.useSupportLibrary = true

        applicationId 'com.poupa.vinylmusicplayer.custom'
        versionCode 20201
        versionName '1.11.0-rev1'

        multiDexEnabled true
    }
    signingConfigs {
        release {
            final String keystorePath = System.getenv("KEYSTORE_FILE")
            if (keystorePath != null && file(keystorePath).exists()) {
                storeFile file(keystorePath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig (signingConfigs.release.storeFile != null ? signingConfigs.release : signingConfigs.debug)
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix ' DEBUG'
        }
    }
    packaging {
        resources {
            excludes += ['META-INF/LICENSE', 'META-INF/NOTICE']
        }
    }
    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled true

        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }
    kotlin {
        jvmToolchain(17)
    }
    buildFeatures {
        dataBinding = true
        viewBinding = true
        buildConfig true
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
    lint {
        abortOnError false
        disable 'MissingTranslation', 'InvalidPackage'
    }
}

dependencies {
    implementation libs.androidx.annotation
    implementation libs.androidx.appcompat
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.core.ktx
    implementation libs.androidx.fragment.ktx
    implementation libs.androidx.gridlayout
    implementation libs.androidx.media
    implementation libs.androidx.multidex
    implementation libs.androidx.palette.ktx
    implementation libs.androidx.percentlayout
    implementation libs.androidx.preference.ktx
    implementation libs.androidx.recyclerview

    // TODO Upgrade to the Kotlin version - the Java one is not maintained
    implementation libs.bundles.material.dialogs

    implementation libs.bundles.glide
    // TODO Right now cannot migrate KAPT to KSP, since we still use KAPT dataBinding
    //      Not clear if KSP supports it - https://issuetracker.google.com/issues/173030256#comment10
    //noinspection KaptUsageInsteadOfKsp
    kapt libs.glide.compiler

    // TODO Replace this library (not updated since years, no doc) by a modern alternative
    implementation libs.app.theme.helper
    implementation libs.recyclerview.fastscroll
    implementation libs.seekarc
    implementation libs.slidinguppanel

    implementation libs.observablescrollview

    implementation libs.material
    implementation libs.gson

    implementation(libs.advrecyclerview) {
        transitive = true
    }

    implementation libs.material.intro

    implementation libs.bundles.retrofit

    implementation libs.bundles.markwon

    implementation libs.materialprogressbar

    implementation libs.media3.exoplayer
    implementation libs.jaudiotagger

    implementation libs.kotlin.stdlib

    testImplementation libs.junit
    testImplementation libs.truth

    coreLibraryDesugaring libs.desugar.jdk.libs
}
